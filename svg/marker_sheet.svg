<text x="10.0" y="238.0" font-family="sans-serif" font-size="3.5" fill="#333" font-weight="bold">HOW TO USE</text><text x="10.0" y="243.0" font-family="sans-serif" font-size="2.8" fill="#555">1. Cut each strip along its edges. </text><text x="10.0" y="248.0" font-family="sans-serif" font-size="2.8" fill="#555">2. Tape strip ends together. Wrap around body at marked level. </text><text x="10.0" y="253.0" font-family="sans-serif" font-size="2.8" fill="#555">3. Photograph front + side. Include ruler in frame. </text><text x="10.0" y="258.0" font-family="sans-serif" font-size="2.8" fill="#555">4. Apply marker dots to: shoulder points, neck base, hip points. Use ruler strip to confirm scale.</text>
